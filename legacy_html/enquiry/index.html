<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Inquiry | Premium</title>
    
    <!-- Satoshi Font from Fontshare -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,300,400&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Satoshi', 'sans-serif'],
                    },
                    colors: {
                        premium: {
                            black: '#000000',
                            border: '#e5e5e5'
                        },
                        // Overriding default gray to absolute neutral grayscale (0% saturation)
                        gray: {
                            50: '#fafafa',
                            100: '#f5f5f5',
                            200: '#e5e5e5',
                            300: '#d4d4d4',
                            400: '#a3a3a3',
                            500: '#737373',
                            600: '#525252',
                            700: '#404040',
                            800: '#262626',
                            900: '#171717',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom Checkbox Styling for B&W theme */
        input[type="checkbox"]:checked {
            background-color: #0a0a0a;
            border-color: #0a0a0a;
        }
        /* Smooth transitions for the 'Other' field */
        .fade-enter {
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease-out;
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen bg-white text-premium-black font-sans flex items-center justify-center p-4 md:p-8 selection:bg-premium-black selection:text-white">

    <div class="max-w-2xl w-full space-y-10">
        
        <!-- Form View Wrapper -->
        <div id="formView" class="space-y-10 transition-all duration-300">
            <!-- Header -->
            <div class="text-center space-y-3">
                <h1 class="text-4xl font-black tracking-tight">Project Inquiry.</h1>
                <p class="text-gray-500 font-medium text-lg">Fill out the details below to request a service.</p>
            </div>

            <!-- Form Container -->
            <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.08)] border border-premium-border p-8 md:p-10">
                
                <div class="flex items-center space-x-3 mb-8 pb-5 border-b border-premium-border">
                    <div class="p-2.5 bg-white border border-premium-border text-premium-black rounded-lg shadow-sm shadow-black/5">
                        <i data-lucide="send" class="w-5 h-5"></i>
                    </div>
                    <h2 class="text-xl font-bold tracking-tight">Submit Details</h2>
                </div>

                <!-- Error Alert Box -->
                <div id="alertBox" class="hidden mb-8 p-4 bg-red-50 border border-red-100 text-red-700 rounded-xl text-sm flex items-start space-x-3 transition-all">
                    <i data-lucide="alert-circle" class="w-5 h-5 mt-0.5 flex-shrink-0"></i>
                    <span id="alertMessage" class="font-medium"></span>
                </div>

                <!-- Success Alert Box (Used for fallback if needed) -->
                <div id="successBox" class="hidden mb-8 p-4 bg-green-50 border border-green-100 text-green-800 rounded-xl text-sm flex items-start space-x-3 transition-all">
                    <i data-lucide="check-circle" class="w-5 h-5 mt-0.5 flex-shrink-0"></i>
                    <span id="successMessage" class="font-medium"></span>
                </div>

                <form id="inquiryForm" class="space-y-6">
                    
                    <!-- Name Input -->
                    <div class="space-y-2.5">
                        <label for="name" class="text-sm font-bold text-gray-700 block">
                            Full Name <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                <i data-lucide="user" class="w-4 h-4"></i>
                            </div>
                            <input type="text" id="name" name="name" 
                                class="block w-full pl-10 pr-4 py-3 bg-white border border-premium-border rounded-xl focus:ring-2 focus:ring-premium-black focus:border-premium-black transition-all text-sm outline-none placeholder:text-gray-400 font-medium"
                                placeholder="e.g. John Doe">
                        </div>
                    </div>

                    <!-- Contact Section Notice -->
                    <div class="pt-4">
                        <p class="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-4">Contact Info (Fill at least one <span class="text-red-500">*</span>)</p>
                    </div>

                    <!-- Email Input -->
                    <div class="space-y-2.5">
                        <label for="email" class="text-sm font-bold text-gray-700 block">Email Address</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                <i data-lucide="mail" class="w-4 h-4"></i>
                            </div>
                            <input type="email" id="email" name="email" 
                                class="block w-full pl-10 pr-4 py-3 bg-white border border-premium-border rounded-xl focus:ring-2 focus:ring-premium-black focus:border-premium-black transition-all text-sm outline-none placeholder:text-gray-400 font-medium"
                                placeholder="e.g. hello@example.com">
                        </div>
                    </div>

                    <!-- Phone Input -->
                    <div class="space-y-2.5">
                        <label for="phone" class="text-sm font-bold text-gray-700 block">Phone Number</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                <i data-lucide="phone" class="w-4 h-4"></i>
                            </div>
                            <input type="tel" id="phone" name="phone" 
                                class="block w-full pl-10 pr-4 py-3 bg-white border border-premium-border rounded-xl focus:ring-2 focus:ring-premium-black focus:border-premium-black transition-all text-sm outline-none placeholder:text-gray-400 font-medium"
                                placeholder="+1 (555) 000-0000">
                        </div>
                    </div>

                    <!-- WhatsApp Checkbox -->
                    <div class="flex items-center space-x-3 pt-2 pb-2">
                        <input type="checkbox" id="sameAsPhone" 
                            class="w-4 h-4 text-premium-black border-gray-300 rounded focus:ring-premium-black cursor-pointer transition-colors">
                        <label for="sameAsPhone" class="text-sm font-medium text-gray-600 cursor-pointer select-none">
                            WhatsApp is same as Phone Number
                        </label>
                    </div>

                    <!-- WhatsApp Input -->
                    <div class="space-y-2.5">
                        <label for="whatsapp" id="whatsappLabel" class="text-sm font-bold text-gray-700 block transition-colors">WhatsApp Number</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 transition-colors" id="whatsappIconWrapper">
                                <i data-lucide="message-circle" class="w-4 h-4"></i>
                            </div>
                            <input type="tel" id="whatsapp" name="whatsapp" 
                                class="block w-full pl-10 pr-4 py-3 bg-white border border-premium-border rounded-xl focus:ring-2 focus:ring-premium-black focus:border-premium-black transition-all text-sm outline-none placeholder:text-gray-400 font-medium disabled:bg-gray-50 disabled:opacity-60 disabled:cursor-not-allowed"
                                placeholder="+1 (555) 000-0000">
                        </div>
                    </div>

                    <!-- Service Divider -->
                    <div class="pt-6 pb-2">
                        <div class="h-px w-full bg-premium-border"></div>
                    </div>

                    <!-- Service Dropdown -->
                    <div class="space-y-2.5">
                        <label for="serviceType" class="text-sm font-bold text-gray-700 block">
                            Type of Service <span class="text-red-500">*</span>
                        </label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                <i data-lucide="briefcase" class="w-4 h-4"></i>
                            </div>
                            <select id="serviceType" name="serviceType" 
                                class="block w-full pl-10 pr-10 py-3 bg-white border border-premium-border rounded-xl focus:bg-white focus:ring-2 focus:ring-premium-black focus:border-premium-black transition-all text-sm outline-none font-medium appearance-none cursor-pointer">
                                <option value="" disabled selected>Select a service...</option>
                                <option value="Web design">Web design</option>
                                <option value="Video edit">Video edit</option>
                                <option value="Motion design">Motion design</option>
                                <option value="Graphic design">Graphic design</option>
                                <option value="AI automation">AI automation</option>
                                <option value="Song making">Song making</option>
                                <option value="Script writing">Script writing</option>
                                <option value="Social media handling">Social media handling</option>
                                <option value="Other">Other</option>
                            </select>
                            <div class="absolute inset-y-0 right-0 flex items-center px-4 pointer-events-none text-gray-500">
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </div>

                    <!-- Specify Other Input (Hidden by default) -->
                    <div id="otherServiceWrapper" class="space-y-2.5 hidden fade-enter">
                        <label for="otherService" class="text-sm font-bold text-gray-700 block">
                            Please Specify Service <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="otherService" name="otherService" 
                            class="block w-full px-4 py-3 bg-white border border-premium-border rounded-xl focus:bg-white focus:ring-2 focus:ring-premium-black focus:border-premium-black transition-all text-sm outline-none placeholder:text-gray-400 font-medium"
                            placeholder="e.g. 3D Animation">
                    </div>

                    <!-- Message Input -->
                    <div class="space-y-2.5">
                        <label for="message" class="text-sm font-bold text-gray-700 block">Additional Message <span class="text-gray-400 font-medium">(Optional)</span></label>
                        <div class="relative">
                            <div class="absolute top-3.5 left-3.5 pointer-events-none text-gray-400">
                                <i data-lucide="message-square" class="w-4 h-4"></i>
                            </div>
                            <textarea id="message" name="message" rows="4" 
                                class="block w-full pl-10 pr-4 py-3 bg-white border border-premium-border rounded-xl focus:bg-white focus:ring-2 focus:ring-premium-black focus:border-premium-black transition-all text-sm outline-none placeholder:text-gray-400 font-medium resize-none"
                                placeholder="Tell us more about your project requirements..."></textarea>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="pt-4">
                        <button type="submit" id="submitBtn" 
                            class="w-full flex justify-center items-center py-3.5 px-4 rounded-xl text-sm font-bold text-white bg-premium-black hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-premium-black transition-all shadow-lg shadow-black/10 disabled:opacity-70 disabled:cursor-not-allowed">
                            
                            <!-- Default State -->
                            <span id="btnDefaultState" class="flex items-center space-x-2">
                                <i data-lucide="send" class="w-4 h-4"></i>
                                <span>Submit Request</span>
                            </span>

                            <!-- Loading State -->
                            <span id="btnLoadingState" class="hidden flex items-center space-x-2">
                                <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                                <span>Processing...</span>
                            </span>

                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Success View (Hidden by default) -->
        <div id="successView" class="hidden bg-white rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.08)] border border-premium-border p-10 text-center fade-enter">
            <div class="mx-auto w-16 h-16 bg-green-50 text-green-600 rounded-full flex items-center justify-center mb-6">
                <i data-lucide="check" class="w-8 h-8"></i>
            </div>
            <h2 class="text-3xl font-black tracking-tight mb-3">Request Submitted.</h2>
            <p class="text-gray-500 font-medium mb-10">Thank you! We've successfully received your details and our team will get back to you shortly.</p>
            
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="/" class="w-full sm:w-auto px-8 py-3.5 rounded-xl text-sm font-bold text-premium-black bg-white border border-premium-border hover:bg-gray-50 transition-all shadow-sm shadow-black/5">
                    Back to Home
                </a>
                <button id="refillBtn" class="w-full sm:w-auto px-8 py-3.5 rounded-xl text-sm font-bold text-white bg-premium-black hover:bg-neutral-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-premium-black transition-all shadow-lg shadow-black/10">
                    Submit Another
                </button>
            </div>
        </div>
        
        <!-- Footer -->
        <div class="text-center pb-8">
            <p class="text-xs font-medium text-gray-400">Secured & Encrypted submission.</p>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Initialize Icons
        lucide.createIcons();

        // Constants
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyKzou2UMGgqt_5d1v9TsiZ_SAPjflaYyKefS6g4QN6Sw9uvWQdsQdCaAmHejq7kcuJ/exec";

        // Elements
        const form = document.getElementById('inquiryForm');
        const formView = document.getElementById('formView');
        const successView = document.getElementById('successView');
        const refillBtn = document.getElementById('refillBtn');

        const phoneInput = document.getElementById('phone');
        const whatsappInput = document.getElementById('whatsapp');
        const sameAsPhoneCheckbox = document.getElementById('sameAsPhone');
        const whatsappLabel = document.getElementById('whatsappLabel');
        const whatsappIconWrapper = document.getElementById('whatsappIconWrapper');
        
        const serviceTypeSelect = document.getElementById('serviceType');
        const otherServiceWrapper = document.getElementById('otherServiceWrapper');
        const otherServiceInput = document.getElementById('otherService');
        
        const alertBox = document.getElementById('alertBox');
        const alertMessage = document.getElementById('alertMessage');
        const successBox = document.getElementById('successBox');
        const successMessage = document.getElementById('successMessage');
        
        const submitBtn = document.getElementById('submitBtn');
        const btnDefaultState = document.getElementById('btnDefaultState');
        const btnLoadingState = document.getElementById('btnLoadingState');

        // Logic: Same as Phone Checkbox
        function handleWhatsappSync() {
            if (sameAsPhoneCheckbox.checked) {
                whatsappInput.value = phoneInput.value;
                whatsappInput.disabled = true;
                whatsappLabel.classList.replace('text-gray-700', 'text-gray-400');
                whatsappIconWrapper.classList.replace('text-gray-400', 'text-gray-300');
            } else {
                whatsappInput.disabled = false;
                whatsappLabel.classList.replace('text-gray-400', 'text-gray-700');
                whatsappIconWrapper.classList.replace('text-gray-300', 'text-gray-400');
            }
        }

        sameAsPhoneCheckbox.addEventListener('change', handleWhatsappSync);
        phoneInput.addEventListener('input', () => {
            if (sameAsPhoneCheckbox.checked) {
                whatsappInput.value = phoneInput.value;
            }
        });

        // Logic: Other Service Dropdown
        serviceTypeSelect.addEventListener('change', (e) => {
            if (e.target.value === 'Other') {
                otherServiceWrapper.classList.remove('hidden');
                // Trigger reflow for animation
                void otherServiceWrapper.offsetWidth; 
                otherServiceWrapper.classList.add('fade-enter-active');
            } else {
                otherServiceWrapper.classList.add('hidden');
                otherServiceWrapper.classList.remove('fade-enter-active');
                if(otherServiceInput) {
                    otherServiceInput.value = ''; // Clear value when hidden
                }
            }
        });

        // Hide alerts on input
        form.addEventListener('input', () => {
            alertBox.classList.add('hidden');
            if(successBox) successBox.classList.add('hidden');
        });

        // Rate Limit Logic (Max 3 submissions per minute)
        function checkRateLimit() {
            const now = Date.now();
            let submissions = JSON.parse(localStorage.getItem('formSubmissions') || '[]');
            
            // Filter to keep only submissions from the last 60 seconds (60000 ms)
            submissions = submissions.filter(time => now - time < 60000);
            
            if (submissions.length >= 3) {
                return false; // Rate limit exceeded
            }
            
            submissions.push(now);
            localStorage.setItem('formSubmissions', JSON.stringify(submissions));
            return true;
        }

        // Logic: Refill Button
        refillBtn.addEventListener('click', () => {
            successView.classList.add('hidden');
            successView.classList.remove('fade-enter-active');
            formView.classList.remove('hidden');
            formView.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });

        // Validation Function
        function validateForm(data) {
            if (!data.name.trim()) return "Full Name is required.";
            if (!data.email.trim() && !data.phone.trim()) return "Please provide either an Email Address or a Phone Number.";
            if (!data.serviceType) return "Please select a Service Type.";
            if (data.serviceType === 'Other' && !data.otherService.trim()) return "Please specify the 'Other' service type.";
            return null;
        }

        // Form Submit Handler
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Gather Data
            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                phone: phoneInput.value,
                whatsapp: whatsappInput.value,
                serviceType: serviceTypeSelect.value,
                otherService: otherServiceInput ? otherServiceInput.value : '',
                message: document.getElementById('message').value
            };

            // Validate
            const error = validateForm(formData);
            if (error) {
                alertMessage.textContent = error;
                alertBox.classList.remove('hidden');
                // Scroll to top of form smoothly
                form.scrollIntoView({ behavior: 'smooth', block: 'start' });
                return;
            }

            // Enforce Rate Limit
            if (!checkRateLimit()) {
                alertMessage.textContent = "Too many requests. Please wait a minute before submitting again.";
                alertBox.classList.remove('hidden');
                form.scrollIntoView({ behavior: 'smooth', block: 'start' });
                return;
            }

            // Set Loading State
            submitBtn.disabled = true;
            btnDefaultState.classList.add('hidden');
            btnLoadingState.classList.remove('hidden');
            alertBox.classList.add('hidden');

            try {
                // Send Request
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: {
                        "Content-Type": "text/plain",
                    },
                    body: JSON.stringify(formData)
                });

                // Transition to Success View
                formView.classList.add('hidden');
                successView.classList.remove('hidden');
                
                // Trigger reflow for smooth animation
                void successView.offsetWidth; 
                successView.classList.add('fade-enter-active');
                
                // Reset Form state quietly in the background
                form.reset();
                handleWhatsappSync(); 
                otherServiceWrapper.classList.add('hidden'); 
                
                successView.scrollIntoView({ behavior: 'smooth', block: 'center' });

            } catch (err) {
                // Show Error
                alertMessage.textContent = "Failed to submit request. Please try again.";
                alertBox.classList.remove('hidden');
            } finally {
                // Restore Button State
                submitBtn.disabled = false;
                btnDefaultState.classList.remove('hidden');
                btnLoadingState.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
